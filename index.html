<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

h1 {
  text-align: center;
  background: #2a72d4;
  color: white;
  padding: 20px;
}

.container {
  width: 90%;
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

.item {
  display: flex;
  justify-content: space-between;
  margin: 12px 0;
  font-size: 18px;
}

input[type="number"] {
  width: 70px;
  text-align: center;
}

.form-group {
  margin-top: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  color: #2a72d4;
}

.form-group input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
}

#celkem, #pocet {
  text-align: center;
  font-size: 22px;
  margin-top: 15px;
  font-weight: bold;
  color: #2a72d4;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 30px;
  font-size: 24px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #e85a28;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

  <div id="items"></div>

  <div id="celkem">Celková cena: 0 Kč</div>
  <div id="pocet">Počet kusů: 0</div>

  <!-- ===================================================== -->
  <!-- NOVÁ VÝPLŇOVÁ POLE -->
  <!-- Povinné pole: Jméno zákazníka -->
  <!-- ===================================================== -->
  <div class="form-group">
    <label for="jmeno">VAŠE JMÉNO:</label>
    <input 
      type="text" 
      id="jmeno"
      placeholder="Brunová Kateřina"
      required>
  </div>

  <!-- ===================================================== -->
  <!-- Povinné pole: Telefon -->
  <!-- ===================================================== -->
  <div class="form-group">
    <label for="telefon">TELEFON:</label>
    <input 
      type="tel" 
      id="telefon"
      placeholder="+420 727 948 181"
      required>
  </div>

  <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

let items = [];

// ✅ načítání CSV
async function loadCSV() {

  try {

    const response = await fetch("data_bufet.csv?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Soubor nebyl nalezen");
    }

    const text = await response.text();

    parseCSV(text);

    renderItems();

  } catch (err) {

    console.error(err);

    alert("Chyba načítání CSV.");

  }
}

// ✅ parsování CSV
function parseCSV(text) {

  items = [];

  const lines = text.split("\n");

  // přeskočíme první řádek (hlavičku)
  for (let i = 1; i < lines.length; i++) {

    const line = lines[i].trim();

    if (!line) continue;

    const [nazev, cena] = line.split(";");

    if (nazev && cena) {

      items.push({
        nazev: nazev.trim(),
        cena: parseFloat(cena.replace(",", ".")),
        mnozstvi: 0
      });

    }
  }
}

// ✅ vykreslení položek
function renderItems() {

  const container = document.getElementById("items");

  container.innerHTML = "";

  items.forEach((item, index) => {

    const div = document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <span>${item.nazev} (${item.cena} Kč)</span>

      <input 
        type="number" 
        min="0" 
        value="0"
        onchange="updateItem(${index}, this.value)">
    `;

    container.appendChild(div);

  });
}

// ✅ změna množství
function updateItem(index, value) {

  items[index].mnozstvi = parseInt(value) || 0;

  updateSummary();
}

// ✅ přepočet objednávky
function updateSummary() {

  let celkem = 0;
  let pocet = 0;

  items.forEach(item => {

    celkem += item.cena * item.mnozstvi;

    pocet += item.mnozstvi;

  });

  document.getElementById("celkem").innerText =
    "Celková cena: " + celkem.toFixed(2) + " Kč";

  document.getElementById("pocet").innerText =
    "Počet kusů: " + pocet;
}

// =====================================================
// ✅ FUNKCE MAILTO
// Otevře e-mailového klienta uživatele
// a předvyplní objednávku do e-mailu
// =====================================================
function odeslatObjednavku() {

  const jmeno = document.getElementById("jmeno").value.trim();

  const telefon = document.getElementById("telefon").value.trim();

  // kontrola povinných polí
  if (jmeno === "") {

    alert("Vyplňte prosím vaše jméno.");

    return;
  }

  if (telefon === "") {

    alert("Vyplňte prosím telefon.");

    return;
  }

  // vybrané položky
  const vybranePolozky = items.filter(item => item.mnozstvi > 0);

  // kontrola objednávky
  if (vybranePolozky.length === 0) {

    alert("Nevybral jsi žádné položky!");

    return;
  }

  let celkemCena = 0;

  let celkemKusu = 0;

  let textObjednavky = "";

  // vytvoření textu objednávky
  vybranePolozky.forEach(item => {

    const cenaPolozky = item.cena * item.mnozstvi;

    celkemCena += cenaPolozky;

    celkemKusu += item.mnozstvi;

    textObjednavky +=
      item.nazev +
      " | " +
      item.mnozstvi +
      " ks | " +
      cenaPolozky.toFixed(2) +
      " Kč\n";

  });

  // obsah e-mailu
  const predmet = "Objednávka školního bufetu";

  const zprava =
`NOVÁ OBJEDNÁVKA

Jméno zákazníka:
${jmeno}

Telefon:
${telefon}

----------------------------

OBJEDNANÉ POLOŽKY:

${textObjednavky}

----------------------------

Celkový počet kusů:
${celkemKusu}

Celková cena:
${celkemCena.toFixed(2)} Kč
`;

  // =====================================================
  // ✅ MAILTO ODKAZ
  // otevře e-mailového klienta
  // =====================================================
  const mailtoLink =
    `mailto:brunova.katerina@kostka-skola.cz` +
    `?subject=${encodeURIComponent(predmet)}` +
    `&body=${encodeURIComponent(zprava)}`;

  window.location.href = mailtoLink;
}

// start aplikace
loadCSV();

</script>

</body>
</html>
